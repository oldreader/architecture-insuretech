apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
spec:
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: shestera/scaletestapp:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "30Mi"
              cpu: "30m"
            limits:
              memory: "30Mi"
              cpu: "30m"